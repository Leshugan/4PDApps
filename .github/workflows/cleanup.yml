name: Уборка старых сборок
run-name: 🧹🧹🧹

on:
  workflow_run:                      # запускается сам, когда сборка завершилась
    workflows: ["Build APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Чистить сборки, только если их больше 10
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          WF=build.yml
          TOTAL=$(gh run list --repo "$REPO" --workflow "$WF" --limit 300 --json databaseId --jq 'length')
          echo "Всего запусков сборки: $TOTAL"
          if [ "$TOTAL" -le 10 ]; then
            echo "Меньше одиннадцати — чистить нечего"
          else
            KEEP=$(gh run list --repo "$REPO" --workflow "$WF" --status success --limit 10 --json databaseId --jq '.[].databaseId')
            FAILS=$(gh run list --repo "$REPO" --workflow "$WF" --status failure --limit 200 --json databaseId --jq '.[].databaseId')
            KEEP_FAIL=$(printf '%s\n' "$FAILS" | head -n 1)      # самую свежую неудачную всегда оставляем
            KEEP=$(printf '%s\n%s\n' "$KEEP" "$KEEP_FAIL")
            gh run list --repo "$REPO" --workflow "$WF" --limit 300 --json databaseId --jq '.[].databaseId' | while read -r id; do
              [ "$id" = "$GITHUB_RUN_ID" ] && continue
              if ! printf '%s\n' "$KEEP" | grep -qx "$id"; then
                gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 && echo "удалён $id" || true
              fi
            done
          fi

      - name: Убрать за собой — все прошлые уборки и этот запуск
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          SELF=cleanup.yml
          gh run list --repo "$REPO" --workflow "$SELF" --limit 300 --json databaseId --jq '.[].databaseId' | while read -r id; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 && echo "удалён прошлый запуск уборки $id" || true
          done
          # себя удаляем последним: запись пропадёт из списка сразу после завершения шага
          ( sleep 25; gh api -X DELETE "repos/$REPO/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true ) &
          echo "запись об этой уборке будет удалена через полминуты"
