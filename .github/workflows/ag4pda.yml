name: Долбёжка AG4pda

on:
  workflow_dispatch:
    inputs:
      per_run:
        description: "Сколько тем обойти за один заход"
        default: "1200"

permissions:
  contents: write
  actions: write

concurrency:
  group: ag4pda
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Записать сборщик
        run: |
          mkdir -p scripts
          cat > scripts/ag4pda-fetch.mjs << 'ENDOFSCRIPT'
          // Робот: собирает сведения с сервера App&Game 4PDA и складывает их в ag4pda.json репозитория.
          // Ничего не скачивает — только спрашивает готовые данные (тема, пакет, версия, подпись и т.д.).
          // Запускается по расписанию из .github/workflows/ag4pda.yml. Токен не нужен.
          import fs from "fs";
          import crypto from "crypto";

          const SRV = "https://srv1.freeman42.ru/app4pda.v3/";
          const APP_VER = "5.3 beta 9 (539)";
          const OUT = "ag4pda_fucker.json";          // связи и карточки — маленький, его читает приложение
          const OUT_FILES = "ag4pda_files.json";     // сведения о файлах тем — крупный, лежит про запас
          const CAT = "catalog.json";
          const PER_RUN = +(process.env.PER_RUN || 2500);      // тем за один запуск
          const PAUSE = +(process.env.PAUSE_MS || 120);

          const rawId = process.env.AG_DEVICE_ID || "t4pdapps-robot-0001";
          const key = Buffer.from(rawId, "utf8").toString("base64").split("").reverse().join("");
          const hash = crypto.createHash("md5").update(rawId).digest("hex");
          const auth = `key=${encodeURIComponent(key)}&hash=${hash}&app_ver=${encodeURIComponent(APP_VER)}`;

          process.on("uncaughtException", (e) => { console.log("сбой:", e && e.message); try { save("после сбоя"); } catch {} process.exit(0); });
          process.on("unhandledRejection", (e) => { console.log("сбой запроса:", e && e.message); });
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function ask(method, extraQuery) {
            const url = `${SRV}${method}?${auth}&${extraQuery}`;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "" });
                const t = await r.text();
                return JSON.parse(t);
              } catch { await sleep(500 * (attempt + 1)); }
            }
            return null;
          }

          function load(file, def) { try { return JSON.parse(fs.readFileSync(file, "utf8")); } catch { return def; } }

          const db = load(OUT, { v: 1, updated: "", cursor: 0, apps: {} });
          db.files = (load(OUT_FILES, { files: {} }).files) || {};
          const MAX_MIN = +(process.env.MAX_MIN || 300);            // работаем не дольше пяти часов, потом сохраняемся
          const t0 = Date.now();
          const overtime = () => (Date.now() - t0) / 60000 > MAX_MIN;
          const save = (why) => {
            try {
              db.updated = new Date().toISOString();
              const { files, ...small } = db;                       // в основной файл — без списков файлов
              fs.writeFileSync(OUT, JSON.stringify(small));
              fs.writeFileSync(OUT_FILES, JSON.stringify({ v: 1, updated: db.updated, files }));
              console.log(`сохранено (${why}): тем ${Object.keys(files).length}, пакетов ${Object.keys(db.apps).length}`);
            } catch (e) { console.log("не удалось сохранить:", e.message); }
          };
          save("старт");                                             // файл существует с первой секунды
          const cat = load(CAT, null);

          // список тем: из каталога, по кругу — за каждый запуск обрабатываем следующий кусок
          let topics = [];
          function extractTopics(obj) {
            const out = new Set();
            const walk = (v) => {
              if (!v) return;
              if (Array.isArray(v)) { v.forEach(walk); return; }
              if (typeof v === "object") {
                for (const k in v) {
                  if (/^\d{4,9}$/.test(k)) out.add(k);
                  const x = v[k];
                  if ((k === "t" || k === "topicId" || k === "topic_id" || k === "id") && /^\d{4,9}$/.test(String(x))) out.add(String(x));
                  walk(x);
                }
                return;
              }
              if (typeof v === "string" && /^\d{4,9}$/.test(v)) out.add(v);
            };
            walk(obj);
            return [...out];
          }
          if (cat) topics = extractTopics(cat);
          if (!topics.length) {                                   // каталога рядом нет — качаем его с GitHub
            try {
              const r = await fetch("https://raw.githubusercontent.com/Leshugan/4PDApps/main/catalog.json");
              if (r.ok) topics = extractTopics(JSON.parse(await r.text()));
            } catch {}
          }
          if (!topics.length) { console.log("список тем не найден: положи catalog.json в корень или проверь ссылку"); process.exit(0); }

          const start = (db.cursor || 0) % topics.length;
          const slice = [];
          for (let i = 0; i < Math.min(PER_RUN, topics.length); i++) slice.push(topics[(start + i) % topics.length]);
          console.log(`тем всего: ${topics.length}, беру ${slice.length}, начиная с позиции ${start}`);

          let ok = 0, empty = 0;
          for (const tid of slice) {
            const o = await ask("getFileInfo.php", `topic_id=${tid}`);
            const data = o && Array.isArray(o.data) ? o.data : null;
            if (!data || !data.length) { empty++; await sleep(PAUSE); continue; }
            const mapped = data.map((x) => ({
              id: String(x.file_id || ""), url: String(x.file_name || ""), ver: String(x.version_name || ""),
              code: +(x.version_code || 0), pkg: String(x.pack_name || ""), sig: String(x.signature || ""),
              minSdk: +(x.min_sdk || 0), flags: +(x.flags || 0), size: +(x.file_size || 0), dl: +(x.downloads_count || 0),
              crc: String(x.crc32 || ""),
            }));
            mapped.sort((a, b) => (b.code || 0) - (a.code || 0));
            db.files[tid] = mapped.slice(0, 40);            // только свежие сборки, история не нужна
            for (const f of data) {
              const pkg = String(f.pack_name || "");
              if (!pkg) continue;
              const prev = db.apps[pkg];
              if (!prev || +(f.version_code || 0) >= (prev.code || 0)) {
                db.apps[pkg] = { topicId: String(tid), ver: String(f.version_name || ""), code: +(f.version_code || 0), sig: String(f.signature || ""), name: String(f.app_name || "") };
              }
            }
            ok++;
            if (ok % 100 === 0) save("по ходу");
            if (overtime()) { console.log("время вышло — сохраняюсь и выхожу"); break; }
            await sleep(PAUSE);
          }

          // ВТОРОЙ ЭТАП: по накопленным пакетам добираем карточки (название, описание, категория, иконка, дата)
          const pkgs = Object.keys(db.apps).filter((p2) => !db.apps[p2].desc);
          console.log(`пакетов без карточки: ${pkgs.length}`);
          for (let i = 0; i < Math.min(pkgs.length, 2000); i += 40) {
            const part = pkgs.slice(i, i + 40);
            const o = await ask("getAppInfo.php", `packages=${encodeURIComponent(part.join("|"))}`);
            const data = o && Array.isArray(o.data) ? o.data : null;
            if (data) for (const x of data) {
              const pkg = String(x.pack_name || ""); if (!pkg) continue;
              db.apps[pkg] = {
                ...(db.apps[pkg] || {}),
                topicId: String(x.topic_id || (db.apps[pkg] || {}).topicId || ""),
                name: String(x.name || (db.apps[pkg] || {}).name || ""),
                desc: String(x.description || ""),
                ver: String(x.ver || (db.apps[pkg] || {}).ver || ""),
                icon: String(x.icon || "").replace(/^http:/, "https:"),
                group: String(x.group_name || ""),
                upd: String(x.forum_update || ""),
              };
            }
            save("карточки");
            if (overtime()) break;
            await sleep(PAUSE);
          }

          const nextCursor = (start + slice.length) % topics.length;
          db.cursor = nextCursor;
          db.total = topics.length;
          db.done = nextCursor === 0 || (db.roundStart != null && start < db.roundStart);   // круг закончен
          if (db.done) { db.roundStart = 0; db.finishedAt = new Date().toISOString(); }
          else db.roundStart = db.roundStart || 0;
          db.updated = new Date().toISOString();
          save("итог");
          console.log(`готово: тем с данными ${ok}, пустых ${empty}; всего пакетов в базе ${Object.keys(db.apps).length}, тем ${Object.keys(db.files).length}`);

          ENDOFSCRIPT
      - name: Создать файл базы сразу
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ ! -f ag4pda_fucker.json ]; then
            echo '{"v":1,"apps":{},"cursor":0}' > ag4pda_fucker.json
            echo '{"v":1,"files":{}}' > ag4pda_files.json
            git add ag4pda_fucker.json ag4pda_files.json
            git commit -m "ag4pda_fucker: файл создан"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          fi
      - name: Собрать сведения с сервера App&Game
        continue-on-error: true
        env:
          PER_RUN: ${{ github.event.inputs.per_run || '1200' }}
          MAX_MIN: "45"
          AG_DEVICE_ID: ${{ secrets.AG_DEVICE_ID || 't4pdapps-robot-0001' }}
        run: node scripts/ag4pda-fetch.mjs
      - name: Сохранить в репозиторий
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          test -f ag4pda_fucker.json || echo '{"v":1,"apps":{}}' > ag4pda_fucker.json
          test -f ag4pda_files.json || echo '{"v":1,"files":{}}' > ag4pda_files.json
          git add ag4pda_fucker.json ag4pda_files.json
          git diff --cached --quiet || git commit -m "ag4pda_fucker: обновление базы"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done
      - name: Следующий заход, пока база не собрана
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DONE=$(node -e "try{const d=require('./ag4pda_fucker.json');console.log(d.done?1:0)}catch(e){console.log(0)}")
          if [ "$DONE" = "1" ]; then
            echo "База собрана целиком — повтор не нужен"
          else
            gh workflow run "Долбёжка AG4pda" -f per_run=${{ github.event.inputs.per_run || '1200' }} || true
          fi
      - name: Почистить историю запусков
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP_OK=$(gh run list --workflow "Долбёжка AG4pda" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          KEEP_BAD=$(gh run list --workflow "Долбёжка AG4pda" --status failure --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run list --workflow "Долбёжка AG4pda" --limit 200 --json databaseId --jq '.[].databaseId' | while read -r ID; do
            if [ -n "$ID" ] && [ "$ID" != "$KEEP_OK" ] && [ "$ID" != "$KEEP_BAD" ] && [ "$ID" != "${{ github.run_id }}" ]; then
              gh run delete "$ID" >/dev/null 2>&1 || true
            fi
          done
