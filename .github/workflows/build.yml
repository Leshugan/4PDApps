name: Build APK
run-name: "🔨 Сборка APK 4PDApps (нативная)"

on:
  push:
    branches: [main]
    paths:
      - 'Project_4PDApps.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать архив проекта в корень
        run: |
          set -e
          if [ ! -f Project_4PDApps.zip ]; then echo "нет Project_4PDApps.zip"; exit 1; fi
          unzip -o -q Project_4PDApps.zip -d _extracted
          if [ -d _extracted/Project_4PDApps ]; then SRC=_extracted/Project_4PDApps; else SRC=_extracted; fi
          shopt -s dotglob
          for item in "$SRC"/*; do
            name=$(basename "$item")
            [ "$name" = ".github" ] && continue
            rm -rf "./$name"; cp -r "$item" "./$name"
          done
          shopt -u dotglob
          rm -rf _extracted; rm -f Project_4PDApps.zip
          echo "=== корень ===" && ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Версия из version.json
        run: |
          APP_VER="1.000"; IS_REL="1"
          if [ -f version.json ]; then
            APP_VER="$(node -e 'try{process.stdout.write(String(require("./version.json").version||"1.000"))}catch(e){process.stdout.write("1.000")}')"
            IS_REL="$(node -e 'try{process.stdout.write(require("./version.json").release===false?"0":"1")}catch(e){process.stdout.write("1")}')"
          fi
          APP_CODE="$(echo "$APP_VER" | awk -F. '{printf "%d%03d", $1, $2}')"
          [ -z "$APP_CODE" ] && APP_CODE=1000
          echo "APP_VER=$APP_VER" >> $GITHUB_ENV
          echo "IS_REL=$IS_REL" >> $GITHUB_ENV
          sed -i "s/versionName \"[^\"]*\"/versionName \"$APP_VER\"/" app/build.gradle
          sed -i "s/versionCode [0-9][0-9]*/versionCode $APP_CODE/" app/build.gradle
          grep -E "versionName|versionCode" app/build.gradle

      - name: Сборка релиза
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Подписать APK
        run: |
          BT=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          OUT="4PDApps v${APP_VER}.apk"
          [ "$IS_REL" = "0" ] && OUT="4PDApps v${APP_VER}-test${GITHUB_RUN_NUMBER}.apk"
          "$APKSIGNER" sign --ks uc.jks --ks-pass pass:updatechecker --key-pass pass:updatechecker --ks-key-alias uc --out "$OUT" "$UNSIGNED"
          "$APKSIGNER" verify "$OUT" && echo "подпись ок"
          ls -la *.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 4PDApps_APK
          path: "*.apk"
