name: Выгрузка каталога App&Game
run-name: 📦 Выгрузка каталога App&Game

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Распаковать архив проекта
        run: |
          if [ ! -f Project_4PDApps.zip ]; then echo "нет Project_4PDApps.zip в корне"; exit 1; fi
          unzip -o -q Project_4PDApps.zip -d _extracted
          if [ -d _extracted/Project_4PDApps ]; then SRC=_extracted/Project_4PDApps; else SRC=_extracted; fi
          mkdir -p scripts
          cp -f "$SRC"/scripts/*.mjs scripts/ 2>/dev/null || true
          ls -la scripts/ | head -5
      - name: Забрать каталог и файлы, отправить в приёмник
        env:
          AG_DEVICE_ID: ${{ secrets.AG_DEVICE_ID }}
        run: node scripts/ag-export.mjs

      - name: Запомнить, докуда дошли
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-state
          path: ag-export-state.json
          if-no-files-found: ignore

      - name: Почистить свои прошлые запуски
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh run list --repo "$REPO" --workflow ag-export.yml --limit 200 --json databaseId,status --jq '.[] | select(.status=="completed") | .databaseId' | while read -r id; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 || true
          done
