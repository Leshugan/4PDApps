name: Сбор данных от пользователей
run-name: 📥 Сбор данных от пользователей

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: userdata
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Забрать записи и дописать в базу
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          test -f ag4pda_users.json || echo '{"v":1,"files":{}}' > ag4pda_users.json
          gh issue list --repo "$REPO" --label filedata --state open --limit 200 --json number,body > /tmp/issues.json
          node - << 'ENDNODE'
          const fs = require("fs");
          const items = JSON.parse(fs.readFileSync("/tmp/issues.json", "utf8"));
          const db = JSON.parse(fs.readFileSync("ag4pda_users.json", "utf8"));
          db.files = db.files || {};
          const done = [];
          let added = 0;
          for (const it of items) {
            let r = null;
            try { r = JSON.parse(String(it.body || "").trim()); } catch {}
            done.push(it.number);
            if (!r || !r.aid || !r.pkg || !r.sig) continue;                 // мусор — просто выбрасываем
            if (!/^https?:\/\/4pda\.(to|ru)\/forum\/dl\/post\/\d+\//i.test(String(r.url || ""))) continue;
            if (!/^[0-9A-Fa-f]{32,64}$/.test(String(r.sig))) continue;
            const t = String(r.topicId || "0");
            db.files[t] = db.files[t] || [];
            const rec = { aid: r.aid, url: r.url, name: r.name, app: r.app_name || "", pkg: r.pkg, ver: r.ver, code: r.code, sig: String(r.sig).toUpperCase(), minSdk: r.minSdk, targetSdk: r.targetSdk || 0, abis: r.abis, size: r.size, crc: String(r.crc32 || "") };
            const idx = db.files[t].findIndex((x) => x.aid === r.aid);
            if (idx < 0) { db.files[t].push(rec); added++; }
            else {                                                        // запись есть — дополняем недостающим
              const old = db.files[t][idx];
              for (const k in rec) if ((old[k] === undefined || old[k] === "" || old[k] === 0) && rec[k]) old[k] = rec[k];
              added++;
            }
            // запись могла раньше лечь без номера темы — убираем такой дубль
            if (t !== "0" && db.files["0"]) db.files["0"] = db.files["0"].filter((x) => x.aid !== r.aid);
          }
          db.updated = new Date().toISOString();
          fs.writeFileSync("ag4pda_users.json", JSON.stringify(db));
          fs.writeFileSync("/tmp/done.txt", done.join("\n"));
          console.log(`записей обработано: ${items.length}, добавлено новых: ${added}`);
          ENDNODE
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ag4pda_users.json
          git diff --cached --quiet || git commit -m "данные от пользователей"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          while read -r n; do
            [ -z "$n" ] && continue
            # сперва пробуем удалить насовсем, если прав не хватит — закрываем
            NODE=$(gh api "repos/$REPO/issues/$n" --jq '.node_id' 2>/dev/null || true)
            DELETED=0
            if [ -n "$NODE" ]; then
              gh api graphql -f query='mutation($id:ID!){deleteIssue(input:{issueId:$id}){clientMutationId}}' -f id="$NODE" >/dev/null 2>&1 && DELETED=1 || true
            fi
            if [ "$DELETED" = "1" ]; then echo "удалена запись $n"; else
              gh api -X PATCH "repos/$REPO/issues/$n" -f state=closed >/dev/null 2>&1 && echo "закрыта запись $n" || echo "не удалось обработать $n"
            fi
          done < /tmp/done.txt

      - name: Почистить свои запуски (оставить 2 последних успешных)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          WF="Сбор данных от пользователей"
          KEEP=$(gh run list --repo "$REPO" --workflow "$WF" --status success --limit 2 --json databaseId --jq '.[].databaseId')
          KEEP_FAIL=$(gh run list --repo "$REPO" --workflow "$WF" --status failure --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run list --repo "$REPO" --workflow "$WF" --limit 200 --json databaseId --jq '.[].databaseId' | while read -r id; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if ! printf '%s\n%s\n' "$KEEP" "$KEEP_FAIL" | grep -qx "$id"; then
              gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 && echo "удалён $id" || true
            fi
          done
